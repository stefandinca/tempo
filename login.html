<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo - Autentificare</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="tempo-logo-small.png" type="image/png">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .login-header {
            text-align: center;
            padding: 40px 30px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }

        .login-header p {
            margin: 8px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .login-tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            background: #fafafa;
        }

        .login-tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            font-weight: 500;
            color: #666;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
        }

        .login-tab.active {
            color: #667eea;
            background: white;
            border-bottom: 2px solid #667eea;
        }

        .login-tab:hover:not(.active) {
            background: #f5f5f5;
        }

        .login-body {
            padding: 35px 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e0e0e0;
        }

        .form-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .password-requirements {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
        }

        .password-requirements ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }

        .password-requirements li {
            margin: 3px 0;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 10px;
            }

            .login-header {
                padding: 30px 20px 20px;
            }

            .login-body {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="tempo-logo-small.png" alt="Tempo Logo" class="login-logo">
                <h1>Tempo Admin</h1>
                <p>Calendar Terapie Management</p>
            </div>

            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">Autentificare</button>
                <button class="login-tab" data-tab="register">Inregistrare</button>
            </div>

            <div class="login-body">
                <!-- Login Form -->
                <div id="loginTab" class="tab-content active">
                    <form id="loginForm">
                        <div id="loginMessage"></div>

                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input type="email" id="loginEmail" name="email" required autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label for="loginPassword">Parola</label>
                            <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn-submit" id="loginBtn">Autentificare</button>

                        <div class="form-footer">
                            <a href="index.html">Inapoi la calendar public</a>
                        </div>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="registerTab" class="tab-content">
                    <form id="registerForm">
                        <div id="registerMessage"></div>

                        <div class="form-group">
                            <label for="registerName">Nume complet</label>
                            <input type="text" id="registerName" name="name" required autocomplete="name">
                        </div>

                        <div class="form-group">
                            <label for="registerEmail">Email</label>
                            <input type="email" id="registerEmail" name="email" required autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label for="registerPassword">Parola</label>
                            <input type="password" id="registerPassword" name="password" required autocomplete="new-password">
                            <div class="password-requirements">
                                <strong>Cerinte parola:</strong>
                                <ul>
                                    <li>Minim 8 caractere</li>
                                    <li>Cel putin o litera mare</li>
                                    <li>Cel putin o cifra</li>
                                </ul>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="registerConfirmPassword">Confirma parola</label>
                            <input type="password" id="registerConfirmPassword" name="confirmPassword" required autocomplete="new-password">
                        </div>

                        <button type="submit" class="btn-submit" id="registerBtn">Inregistrare</button>

                        <div class="form-footer">
                            <a href="index.html">Inapoi la calendar public</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
