<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Terapie - Vizualizare Publica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        secondary: '#F4E8D8',
                    }
                }
            }
        }
    </script>
    <style>
        [data-theme="dark"] { color-scheme: dark; }
        [data-theme="light"] { color-scheme: light; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <div class="container max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Live Better Life" class="h-12 sm:h-14 w-auto">
                <h1 class="text-2xl sm:text-3xl font-semibold text-gray-900 dark:text-white">Calendar terapie</h1>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto">
                <button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" id="themeToggle" title="Schimba tema">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-gray-600 dark:text-gray-400">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M11 0H13V4.06189C12.6724 4.02104 12.3387 4 12 4C11.6613 4 11.3276 4.02104 11 4.06189V0ZM7.0943 5.68018L4.22173 2.80761L2.80752 4.22183L5.6801 7.09441C6.09071 6.56618 6.56608 6.0908 7.0943 5.68018ZM4.06189 11H0V13H4.06189C4.02104 12.6724 4 12.3387 4 12C4 11.6613 4.02104 11.3276 4.06189 11ZM5.6801 16.9056L2.80751 19.7782L4.22173 21.1924L7.0943 18.3198C6.56608 17.9092 6.09071 17.4338 5.6801 16.9056ZM11 19.9381V24H13V19.9381C12.6724 19.979 12.3387 20 12 20C11.6613 20 11.3276 19.979 11 19.9381ZM16.9056 18.3199L19.7781 21.1924L21.1923 19.7782L18.3198 16.9057C17.9092 17.4339 17.4338 17.9093 16.9056 18.3199ZM19.9381 13H24V11H19.9381C19.979 11.3276 20 11.6613 20 12C20 12.3387 19.979 12.6724 19.9381 13ZM18.3198 7.0943L21.1923 4.22183L19.7781 2.80762L16.9056 5.6801C17.4338 6.09071 17.9092 6.56608 18.3198 7.0943Z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" id="fullscreenToggle" title="Ecran complet">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" class="text-gray-600 dark:text-gray-400">
                        <path d="M1 1v5h2V3h3V1H1zm9 0v2h3v3h2V1h-5zM1 10v5h5v-2H3v-3H1zm12 0v3h-3v2h5v-5h-2z"/>
                    </svg>
                </button>
                <div class="hidden sm:flex bg-gray-100 dark:bg-gray-800 rounded-lg p-1">
                    <button class="view-btn px-4 py-2 rounded-md text-sm font-medium transition-colors active" data-view="month">Luna</button>
                    <button class="view-btn px-4 py-2 rounded-md text-sm font-medium transition-colors" data-view="week">Saptamana</button>
                    <button class="view-btn px-4 py-2 rounded-md text-sm font-medium transition-colors" data-view="day">Zi</button>
                </div>
            </div>
        </div>
        
        <!-- Filters and Navigation Row -->
        <div class="flex flex-col gap-4 mb-6">
            <!-- Filters -->
            <div class="flex flex-wrap gap-2" id="filters"></div>
            
            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm">
                <div class="text-lg sm:text-xl font-semibold text-gray-900 dark:text-white" id="currentPeriod">Octombrie 2025</div>
                <div class="flex items-center gap-2">
                    <button id="prevBtn" class="p-2 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="Precedenta">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </button>
                    <button id="todayBtn" class="px-4 py-2 rounded-lg bg-primary text-white hover:bg-blue-600 transition-colors font-medium" title="Azi">Azi</button>
                    <button id="nextBtn" class="p-2 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="Urmatoarea">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Calendar View -->
        <div id="calendarView" class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-4"></div>

        <!-- Powered By -->
        <div class="flex items-center justify-center gap-2 mt-6 text-sm text-gray-500 dark:text-gray-400">
            Powered by: <img src="tempo-logo-small.png" alt="Tempo Logo" class="h-6 w-auto" />
        </div>
    </div>
    
    <!-- Event Details Modal -->
    <div class="modal fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center p-4" id="eventDetailsModal">
        <div class="modal-content bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-6 border-b border-gray-200 dark:border-gray-700">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Detalii eveniment</h2>
                <button class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" id="closeEventDetailsModal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                    </svg>
                </button>
            </div>
            
            <div id="eventDetailsContent" class="p-6"></div>
            
            <div class="p-6 border-t border-gray-200 dark:border-gray-700">
                <h3 class="text-lg font-semibold mb-2">Comentarii</h3>
                <textarea id="eventComments" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-primary focus:border-transparent" rows="4" placeholder="Adauga notite sau comentarii despre acest eveniment..."></textarea>
            </div>
            
            <div class="flex gap-3 p-6 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700">
                <button type="button" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors" id="deleteEventFromDetails">Sterge</button>
                <button type="button" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors" id="closeEventDetails">Inchide</button>
                <button type="button" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 transition-colors ml-auto" id="editEventFromDetails">Editeaza</button>
            </div>
        </div>
    </div>
    
    <script src="calendar.js"></script>
</body>
</html>
