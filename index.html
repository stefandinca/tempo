<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Terapie - Vizualizare Publica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <img src="logo.png" alt="Live Better Life" class="header-logo-inline">
        <h1>Calendar terapie</h1>
      </div>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <button class="theme-toggle" id="themeToggle" title="Schimba tema">
          <span class="theme-icon"><svg
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18Z"
    fill="currentColor"
  />
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M11 0H13V4.06189C12.6724 4.02104 12.3387 4 12 4C11.6613 4 11.3276 4.02104 11 4.06189V0ZM7.0943 5.68018L4.22173 2.80761L2.80752 4.22183L5.6801 7.09441C6.09071 6.56618 6.56608 6.0908 7.0943 5.68018ZM4.06189 11H0V13H4.06189C4.02104 12.6724 4 12.3387 4 12C4 11.6613 4.02104 11.3276 4.06189 11ZM5.6801 16.9056L2.80751 19.7782L4.22173 21.1924L7.0943 18.3198C6.56608 17.9092 6.09071 17.4338 5.6801 16.9056ZM11 19.9381V24H13V19.9381C12.6724 19.979 12.3387 20 12 20C11.6613 20 11.3276 19.979 11 19.9381ZM16.9056 18.3199L19.7781 21.1924L21.1923 19.7782L18.3198 16.9057C17.9092 17.4339 17.4338 17.9093 16.9056 18.3199ZM19.9381 13H24V11H19.9381C19.979 11.3276 20 11.6613 20 12C20 12.3387 19.979 12.6724 19.9381 13ZM18.3198 7.0943L21.1923 4.22183L19.7781 2.80762L16.9056 5.6801C17.4338 6.09071 17.9092 6.56608 18.3198 7.0943Z"
    fill="currentColor"
  />
</svg></span>
        </button>

        <button class="icon-btn" id="fullscreenToggle" title="Ecran complet">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
    <path d="M1 1v5h2V3h3V1H1zm9 0v2h3v3h2V1h-5zM1 10v5h5v-2H3v-3H1zm12 0v3h-3v2h5v-5h-2z"/>
  </svg>
</button>


        <div class="view-toggle">
          <button class="view-btn active" data-view="month">Lunar</button>
          <button class="view-btn" data-view="week">Saptamanal</button>
          <button class="view-btn" data-view="day">Zilnic</button>
        </div>
      </div>
    </div>
    
    <!-- Filters and Navigation Row -->
    <div class="filters-nav-row">
      <!-- Filters -->
      <div class="filters" id="filters"></div>
      
      <!-- Navigation Controls -->
      <div class="nav-controls">
        <div class="current-period" id="currentPeriod">Octombrie 2025</div>
        <div class="nav-buttons">
          <button id="prevBtn" title="Precedenta" class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <button id="todayBtn" title="Azi" class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
              <circle cx="12" cy="15" r="2"/>
            </svg>
          </button>
          <button id="nextBtn" title="Urmatoarea" class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Calendar View -->
    <div id="calendarView"></div>

    <div class="powered-by">
    Powered by: <img src="tempo-logo-small.png" alt="Tempo Logo" class="powered-logo" />
  </div>

  </div>
  
  <!-- Event Details Modal -->
  <div class="modal" id="eventDetailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Detalii eveniment</h2>
        <button class="close-button" id="closeEventDetailsModal">&times;</button>
      </div>
      
      <div id="eventDetailsContent">
        <!-- Event details will be populated here -->
      </div>
      
      <div class="event-details-section">
        <h3>Comentarii</h3>
        <textarea id="eventComments" class="event-comments-area" placeholder="Adauga notite sau comentarii despre acest eveniment..."></textarea>
      </div>
      
      <div class="button-group">
        <button type="button" class="btn btn-danger" id="deleteEventFromDetails">Sterge</button>
        <button type="button" class="btn btn-secondary" id="closeEventDetails">Inchide</button>
        <button type="button" class="btn btn-primary" id="editEventFromDetails">Editeaza</button>
      </div>
    </div>
  </div>
  
  <script src="calendar.js"></script>
  
</body>
</html>
