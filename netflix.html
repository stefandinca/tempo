<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine urmărește? - Tempo Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        secondary: '#F4E8D8',
                        netflix: '#E50914',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="stylesheet" href="netflix.css">
</head>
<body class="netflix-body">
    <div class="netflix-container">
        <!-- Logo in top left corner -->
        <div class="netflix-logo-container">
            <img src="tempo-logo-dark.png" alt="Tempo Logo" class="netflix-logo">
        </div>

        <!-- Main content -->
        <div class="netflix-content">
            <h1 class="netflix-title">Cine urmărește?</h1>
            
            <div id="userCardsContainer" class="netflix-profiles-grid">
                <!-- User cards will be dynamically inserted here -->
            </div>
        </div>

        <!-- Calendar Section -->
        <div class="public-calendar-container netflix-calendar">
            <header class="public-calendar-header">
                <h2 id="publicCurrentPeriod" class="dark:text-white">Calendar Public</h2>
                <div class="flex flex-wrap items-center gap-2">
                    <div class="nav-controls">
                        <button id="publicPrevBtn" class="nav-btn" title="Perioada precedentă">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button id="publicTodayBtn" class="nav-btn" style="padding-left: 1rem; padding-right: 1rem; font-weight: 500;">Azi</button>
                        <button id="publicNextBtn" class="nav-btn" title="Perioada următoare">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="month">Lună</button>
                        <button class="view-btn" data-view="week">Săptămână</button>
                        <button class="view-btn" data-view="day">Zi</button>
                    </div>
                </div>
            </header>
            <div id="publicFilters" class="filters-container"></div>
            <div id="publicCalendarView" class="calendar-view"></div>
        </div>
    </div>

    <!-- Parent Modal -->
    <div id="parentModal" class="parent-modal">
        <div class="parent-modal-content">
            <div class="parent-modal-header">
                <h2 id="parentModalTitle">Profil Client</h2>
                <button id="closeParentModal" class="parent-modal-close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="parent-modal-body" id="parentModalContent"></div>
        </div>
    </div>

    <script type="module">
        // API Configuration
        const API_BASE = 'api.php';
        
        // NOU: Parole hardcodate
        const USER_PASSWORDS = {
            'corina': '$C0r1n4',
            'dana': '#D4n4G',      // ID-ul din data.json pentru Dana G
            'daniela': '@D4n4P',    // ID-ul din data.json pentru Dana P
            'alexandra': '!Al3x4', // ID-ul din data.json pentru Alexandra
            'member_1762036330730': '&St3f' // ID-ul din data.json pentru Stefan
        };

        // Store current selected month for schedule viewing
        let currentScheduleDate = new Date();

        const calendarState = {
            currentDate: new Date(),
            currentView: 'month',
            teamMembers: [],
            clients: [],
            events: [],
            activeFilters: [],
        };

        async function loadTeamMembers() {
            try {
                const response = await fetch(`${API_BASE}?path=data`);
                const data = await response.json();
                // Filtrăm utilizatorii care au parole definite (excludem pe oricine nu e în lista de parole)
                return (data.teamMembers || []).filter(member => USER_PASSWORDS.hasOwnProperty(member.id));
            } catch (error) {
                console.error('Error loading team members:', error);
                return [];
            }
        }

        async function loadAllData() {
            try {
                const response = await fetch(`${API_BASE}?path=data`);
                const data = await response.json();
                
                // Salvăm datele în state-ul local
                calendarState.teamMembers = data.teamMembers || [];
                calendarState.clients = data.clients || [];
                calendarState.events = data.events || [];
                // Setăm filtrele active inițial ca fiind toți membrii
                calendarState.activeFilters = (data.teamMembers || []).map(m => m.id);

                // Filtrăm membrii pentru cardurile de login (logica originală)
                return (data.teamMembers || []).filter(member => USER_PASSWORDS.hasOwnProperty(member.id));
            } catch (error) {
                console.error('Error loading all data:', error);
                return [];
            }
        }

        async function loadClientData(clientId) {
            try {
                const [dataResponse, evolutionResponse] = await Promise.all([
                    fetch(`${API_BASE}?path=data`),
                    fetch(`${API_BASE}?path=evolution.json`)
                ]);
                
                const data = await dataResponse.json();
                const evolutionData = await evolutionResponse.json();
                
                const client = data.clients.find(c => c.id === clientId);
                if (!client) return null;
                
                const clientEvolution = evolutionData[clientId] || {};
                
                // Filter events for this client
                const clientEvents = data.events.filter(event => {
                    const clientIds = event.clientIds || (event.clientId ? [event.clientId] : []);
                    return clientIds.includes(clientId);
                });
                
                return {
                    client,
                    evolution: clientEvolution,
                    events: clientEvents,
                    teamMembers: data.teamMembers || []
                };
            } catch (error) {
                console.error('Error loading client data:', error);
                return null;
            }
        }

        function getInitials(name) {
            return name
                .split(' ')
                .map(word => word[0])
                .join('')
                .toUpperCase()
                .substring(0, 2);
        }

        function getRoleBadgeClass(role) {
            const roleMap = {
                'terapeut': 'role-therapist',
                'coordinator': 'role-coordinator',
                'admin': 'role-admin',
                'parinte': 'role-parent'
            };
            return roleMap[role.toLowerCase()] || 'role-therapist';
        }

        function getRoleText(role) {
            const roleMap = {
                'terapeut': 'Terapeut',
                'coordinator': 'Coordinator',
                'admin': 'Administrator',
                'parinte': 'Părinte'
            };
            return roleMap[role.toLowerCase()] || role;
        }

        async function renderUserCards() {
            const container = document.getElementById('userCardsContainer');
            const members = await loadAllData();
            
            container.innerHTML = members.map(member => {
                const initials = getInitials(member.name);
                const isParent = member.role && member.role.toLowerCase() === 'parinte';
                
                return `
                    <div class="netflix-profile ${isParent ? 'parent-card' : ''}" 
                         data-member-id="${member.id}"
                         data-role="${member.role || 'terapeut'}">
                        <div class="netflix-avatar" style="background: ${member.color}">
                            ${initials}
                        </div>
                        <div class="netflix-profile-name">${member.name}</div>
                        ${!isParent ? `
                            <div class="netflix-password-container" style="display: none;">
                                <input type="password" 
                                       class="netflix-password-input" 
                                       placeholder="Parolă"
                                       data-member-id="${member.id}">
                                <button class="netflix-login-btn" data-member-id="${member.id}">
                                    Intră
                                </button>
                            </div>
                        ` : `
                            <div class="netflix-parent-container" style="display: none;">
                                <input type="text" 
                                       class="netflix-code-input" 
                                       placeholder="Cod client"
                                       data-member-id="${member.id}">
                                <button class="netflix-view-btn" data-member-id="${member.id}">
                                    Vezi profil
                                </button>
                            </div>
                        `}
                    </div>
                `;
            }).join('');

            // Add click handlers
            document.querySelectorAll('.netflix-profile').forEach(profile => {
                const avatar = profile.querySelector('.netflix-avatar');
                const name = profile.querySelector('.netflix-profile-name');
                const memberId = profile.dataset.memberId;
                const isParent = profile.classList.contains('parent-card');
                
                const clickHandler = () => {
                    // Hide all input containers first
                    document.querySelectorAll('.netflix-password-container, .netflix-parent-container').forEach(c => {
                        c.style.display = 'none';
                    });
                    
                    // Show the appropriate input for this profile
                    const container = isParent ? 
                        profile.querySelector('.netflix-parent-container') : 
                        profile.querySelector('.netflix-password-container');
                    
                    if (container) {
                        container.style.display = 'flex';
                        const input = container.querySelector('input');
                        if (input) {
                            setTimeout(() => input.focus(), 100);
                        }
                    }
                };
                
                avatar.addEventListener('click', clickHandler);
                name.addEventListener('click', clickHandler);
            });

            // Password login handlers
            document.querySelectorAll('.netflix-login-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const memberId = btn.dataset.memberId;
                    const input = document.querySelector(`.netflix-password-input[data-member-id="${memberId}"]`);
                    const password = input.value;
                    
                    if (USER_PASSWORDS[memberId] === password) {
                        localStorage.setItem('loggedInUser', memberId);
                        window.location.href = 'dashboard.html';
                    } else {
                        input.value = '';
                        input.style.borderColor = '#E50914';
                        input.placeholder = 'Parolă incorectă';
                        setTimeout(() => {
                            input.style.borderColor = '';
                            input.placeholder = 'Parolă';
                        }, 2000);
                    }
                });
            });

            // Enter key support for password
            document.querySelectorAll('.netflix-password-input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const btn = document.querySelector(`.netflix-login-btn[data-member-id="${input.dataset.memberId}"]`);
                        btn.click();
                    }
                });
            });

            // Parent profile handlers
            document.querySelectorAll('.netflix-view-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const input = document.querySelector(`.netflix-code-input[data-member-id="${btn.dataset.memberId}"]`);
                    const code = input.value.trim();
                    
                    if (!code) {
                        input.style.borderColor = '#E50914';
                        return;
                    }

                    btn.disabled = true;
                    btn.textContent = 'Se încarcă...';

                    try {
                        const response = await fetch(`${API_BASE}?path=data`);
                        const data = await response.json();
                        const client = data.clients.find(c => c.accessCode === code);

                        if (client) {
                            await showParentProfile(client.id);
                            input.value = '';
                        } else {
                            input.value = '';
                            input.style.borderColor = '#E50914';
                            input.placeholder = 'Cod invalid';
                            setTimeout(() => {
                                input.style.borderColor = '';
                                input.placeholder = 'Cod client';
                            }, 2000);
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Eroare la încărcarea profilului');
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'Vezi profil';
                    }
                });
            });

            // Enter key support for parent code
            document.querySelectorAll('.netflix-code-input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const btn = document.querySelector(`.netflix-view-btn[data-member-id="${input.dataset.memberId}"]`);
                        btn.click();
                    }
                });
            });
        }

        async function showParentProfile(clientId) {
            const modal = document.getElementById('parentModal');
            const content = document.getElementById('parentModalContent');
            
            content.innerHTML = '<div style="text-align: center; padding: 2rem;">Se încarcă...</div>';
            modal.classList.add('active');

            const clientData = await loadClientData(clientId);
            
            if (!clientData) {
                content.innerHTML = '<div class="error-message">Nu s-au găsit date pentru acest client.</div>';
                return;
            }

            const { client, evolution, events, teamMembers } = clientData;
            
            // Client Info Section
            let html = `
                <div class="client-info-section">
                    <h3 class="section-title">Informații Client</h3>
                    <div class="client-info-grid">
                        <div class="info-item">
                            <span class="info-label">Nume</span>
                            <span class="info-value">${client.name}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Vârstă</span>
                            <span class="info-value">${client.age || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Status</span>
                            <span class="info-value">${client.status || 'Activ'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Cod Acces</span>
                            <span class="info-value">${client.accessCode}</span>
                        </div>
                    </div>
                </div>
            `;

            // Evolution Chart
            if (evolution && Object.keys(evolution).length > 0) {
                html += `
                    <div class="client-info-section">
                        <h3 class="section-title">Evoluție</h3>
                        <div class="chart-container-parent">
                            <canvas id="evolutionChart"></canvas>
                        </div>
                    </div>
                `;
            }

            // Monthly Schedule
            html += `
                <div class="client-info-section">
                    <h3 class="section-title">Programare Luna Curentă</h3>
                    <div class="month-selector">
                        <button id="prevMonthBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <span id="currentMonthLabel"></span>
                        <button id="nextMonthBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                    <div id="scheduleStatsContainer"></div>
                    <div id="scheduleListContainer"></div>
                </div>
            `;

            content.innerHTML = html;

            // Render evolution chart
            if (evolution && Object.keys(evolution).length > 0) {
                renderEvolutionChart(evolution);
            }

            // Render schedule
            renderMonthlySchedule(events, teamMembers);

            // Month navigation handlers
            document.getElementById('prevMonthBtn').addEventListener('click', () => {
                currentScheduleDate.setMonth(currentScheduleDate.getMonth() - 1);
                renderMonthlySchedule(events, teamMembers);
            });

            document.getElementById('nextMonthBtn').addEventListener('click', () => {
                currentScheduleDate.setMonth(currentScheduleDate.getMonth() + 1);
                renderMonthlySchedule(events, teamMembers);
            });
        }

        function renderEvolutionChart(evolution) {
            const ctx = document.getElementById('evolutionChart');
            if (!ctx) return;

            const programs = Object.keys(evolution).sort();
            const datasets = {};

            programs.forEach(program => {
                const entries = evolution[program];
                entries.forEach(entry => {
                    Object.keys(entry).forEach(key => {
                        if (key !== 'date' && key !== 'notes') {
                            if (!datasets[key]) {
                                datasets[key] = {
                                    label: key,
                                    data: [],
                                    borderColor: `hsl(${Object.keys(datasets).length * 40}, 70%, 50%)`,
                                    backgroundColor: `hsla(${Object.keys(datasets).length * 40}, 70%, 50%, 0.1)`,
                                    tension: 0.4
                                };
                            }
                            datasets[key].data.push({
                                x: entry.date,
                                y: entry[key]
                            });
                        }
                    });
                });
            });

            new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: Object.values(datasets)
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'month'
                            },
                            title: {
                                display: true,
                                text: 'Data'
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Scor'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                        }
                    }
                }
            });
        }

        function renderMonthlySchedule(allEvents, teamMembers) {
            const monthLabel = document.getElementById('currentMonthLabel');
            const statsContainer = document.getElementById('scheduleStatsContainer');
            const listContainer = document.getElementById('scheduleListContainer');

            const year = currentScheduleDate.getFullYear();
            const month = currentScheduleDate.getMonth();

            monthLabel.textContent = currentScheduleDate.toLocaleString('ro-RO', { month: 'long', year: 'numeric' });

            // Filter events for current month
            const monthEvents = allEvents.filter(event => {
                const eventDate = new Date(event.date);
                return eventDate.getFullYear() === year && eventDate.getMonth() === month;
            });

            // Calculate stats
            const totalHours = monthEvents.reduce((sum, event) => sum + (event.duration || 0) / 60, 0);
            const presentCount = monthEvents.filter(e => e.attendance === 'present').length;
            const absentCount = monthEvents.filter(e => e.attendance === 'absent').length;

            statsContainer.innerHTML = `
                <div class="schedule-stats-grid">
                    <div class="stat-card">
                        <div class="stat-value hours">${totalHours.toFixed(1)}</div>
                        <div class="stat-label">Ore Total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value present">${presentCount}</div>
                        <div class="stat-label">Prezent</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value absent">${absentCount}</div>
                        <div class="stat-label">Absent</div>
                    </div>
                </div>
            `;

            // Sort events by date
            const sortedEvents = monthEvents.sort((a, b) => {
                const dateCompare = a.date.localeCompare(b.date);
                if (dateCompare !== 0) return dateCompare;
                return (a.startTime || '').localeCompare(b.startTime || '');
            });

            listContainer.innerHTML = `
                <div class="schedule-list">
                    ${sortedEvents.map(event => {
                        const eventDate = new Date(event.date);
                        const formattedDate = eventDate.toLocaleDateString('ro-RO', { 
                            weekday: 'short', 
                            day: 'numeric', 
                            month: 'short' 
                        });

                        const therapist = teamMembers.find(m => {
                            const memberIds = event.teamMemberIds || (event.teamMemberId ? [event.teamMemberId] : []);
                            return memberIds.includes(m.id);
                        });

                        const statusBadge = event.attendance === 'present' 
                            ? '<span class="status-badge present">✓ Prezent</span>'
                            : event.attendance === 'absent'
                            ? '<span class="status-badge absent">✗ Absent</span>'
                            : '';

                        return `
                            <div class="schedule-item">
                                <div>
                                    <div class="schedule-date">${formattedDate}</div>
                                    <div class="schedule-time">${event.startTime || ''} - ${event.name}</div>
                                    ${therapist ? `<div class="schedule-time" style="color: ${therapist.color}">${therapist.name}</div>` : ''}
                                </div>
                                <div class="schedule-status">
                                    ${statusBadge}
                                </div>
                            </div>
                        `;
                    }).join('')}
                    ${sortedEvents.length === 0 ? '<p style="text-align: center; color: #6b7280; padding: 2rem;">Nu există programări pentru această lună.</p>' : ''}
                </div>
            `;
        }

        // Close modal handler
        document.getElementById('closeParentModal').addEventListener('click', () => {
            document.getElementById('parentModal').classList.remove('active');
        });

        document.getElementById('parentModal').addEventListener('click', (e) => {
            if (e.target.id === 'parentModal') {
                document.getElementById('parentModal').classList.remove('active');
            }
        });

        // Calendar rendering functions (keeping existing calendar functionality)
        function calculateEndTime(startTime, durationMinutes) {
            if (!startTime || !durationMinutes) return '';
            const [hours, minutes] = startTime.split(':').map(Number);
            const totalMinutes = hours * 60 + minutes + durationMinutes;
            const endHours = Math.floor(totalMinutes / 60);
            const endMinutes = totalMinutes % 60;
            return `${String(endHours).padStart(2, '0')}:${String(endMinutes).padStart(2, '0')}`;
        }

        async function initPublicCalendar() {
            const { teamMembers } = calendarState;
            renderPublicFilters();
            renderPublicCalendar();
        }

        function renderPublicFilters() {
            const filtersContainer = document.getElementById('publicFilters');
            const { teamMembers, activeFilters } = calendarState;

            filtersContainer.innerHTML = teamMembers.map(member => {
                const isActive = activeFilters.includes(member.id);
                return `
                    <button class="filter-chip ${isActive ? 'active' : ''}" 
                            data-member-id="${member.id}"
                            style="color: ${member.color}">
                        <span class="color-dot" style="background-color: ${member.color}"></span>
                        <span>${member.name}</span>
                    </button>
                `;
            }).join('');

            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const memberId = chip.dataset.memberId;
                    const index = calendarState.activeFilters.indexOf(memberId);
                    
                    if (index > -1) {
                        calendarState.activeFilters.splice(index, 1);
                    } else {
                        calendarState.activeFilters.push(memberId);
                    }
                    
                    renderPublicFilters();
                    renderPublicCalendar();
                });
            });
        }

        function renderPublicCalendar() {
            const viewElement = document.getElementById('publicCalendarView');
            const { currentView, currentDate } = calendarState;

            updateCurrentPeriodLabel(currentDate, currentView);

            if (currentView === 'month') {
                renderMonthView(viewElement);
            } else if (currentView === 'week') {
                renderWeekView(viewElement);
            } else if (currentView === 'day') {
                renderDayView(viewElement);
            }
        }

        function renderMonthView(viewElement) {
            const { currentDate } = calendarState;
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            const startDate = new Date(firstDay);
            const dayOfWeek = startDate.getDay();
            const offset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
            startDate.setDate(startDate.getDate() - offset);
            
            const endDate = new Date(lastDay);
            const endDayOfWeek = endDate.getDay();
            const endOffset = endDayOfWeek === 0 ? 0 : 7 - endDayOfWeek;
            endDate.setDate(endDate.getDate() + endOffset);
            
            const days = [];
            const current = new Date(startDate);
            while (current <= endDate) {
                days.push(new Date(current));
                current.setDate(current.getDate() + 1);
            }
            
            const weekDays = ['Lun', 'Mar', 'Mie', 'Joi', 'Vin', 'Sâm', 'Dum'];
            
            let html = '<div class="calendar-grid month-view">';
            
            weekDays.forEach(day => {
                html += `<div class="calendar-header-cell">${day}</div>`;
            });
            
            days.forEach((day) => {
                const isCurrentMonth = day.getMonth() === month;
                const isTodayDate = isToday(day);
                const isWeekendDay = isWeekend(day);
                
                const dayClasses = [
                    'calendar-day-cell',
                    !isCurrentMonth && 'other-month',
                    isTodayDate && 'today',
                    isWeekendDay && 'weekend'
                ].filter(Boolean).join(' ');
                
                html += `
                    <div class="${dayClasses}">
                        <div class="day-number">${day.getDate()}</div>
                        <div class="day-events-compact">
                `;
                
                const dayEvents = getEventsForDatePublic(day);
                dayEvents.slice(0, 3).forEach(event => {
                    const teamMemberIds = event.teamMemberIds || (event.teamMemberId ? [event.teamMemberId] : []);
                    const therapist = calendarState.teamMembers.find(m => teamMemberIds.includes(m.id));
                    
                    if (event.isPublic) {
                        html += `
                            <div class="event-dot-compact" 
                                 style="background-color: ${therapist ? therapist.color : '#888'}"
                                 title="${event.name}">
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="event-dot-compact occupied" 
                                 style="border-color: ${therapist ? therapist.color : '#888'}"
                                 title="Ocupat">
                            </div>
                        `;
                    }
                });
                
                if (dayEvents.length > 3) {
                    html += `<div class="more-events">+${dayEvents.length - 3}</div>`;
                }
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            viewElement.innerHTML = html;
        }

        function renderWeekView(viewElement) {
            const { currentDate, activeFilters, teamMembers } = calendarState;
            const weekStart = getWeekStart(currentDate);
            
            const days = [];
            for (let i = 0; i < 7; i++) {
                const day = new Date(weekStart);
                day.setDate(day.getDate() + i);
                days.push(day);
            }
            
            const visibleTherapists = activeFilters.length === 0 
                ? teamMembers 
                : teamMembers.filter(m => activeFilters.includes(m.id));
            
            if (visibleTherapists.length === 0) {
                viewElement.innerHTML = '<div style="padding: 2rem; text-align: center; color: #6b7280;">Selectează cel puțin un terapeut pentru a vizualiza calendarul.</div>';
                return;
            }
            
            let html = '<div class="calendar-grid-week">';
            html += '<div class="time-column">';
            html += '<div class="time-header"></div>';
            for (let hour = 8; hour <= 20; hour++) {
                html += `<div class="time-slot">${formatHour(hour)}</div>`;
            }
            html += '</div>';
            
            days.forEach((day) => {
                const isTodayDate = isToday(day);
                const isWeekendDay = isWeekend(day);
                const dayClasses = [
                    'day-column',
                    isTodayDate && 'today',
                    isWeekendDay && 'weekend'
                ].filter(Boolean).join(' ');
                
                html += `<div class="${dayClasses}">`;
                html += `
                    <div class="day-header">
                        <div class="day-name">${day.toLocaleDateString('ro-RO', { weekday: 'short' })}</div>
                        <div class="day-date">${day.getDate()}</div>
                    </div>
                `;
                
                for (let hour = 8; hour <= 20; hour++) {
                    const dateStr = formatDateISO(day);
                    html += `<div class="hour-slot" data-date="${dateStr}" data-hour="${hour}">
                                <div class="event-container" data-date="${dateStr}" data-hour="${hour}"></div>
                             </div>`;
                }
                
                html += '</div>';
            });
            
            html += '</div>';
            viewElement.innerHTML = html;
            
            renderEventsInPublicGrid(days, viewElement);
        }

        function renderDayView(viewElement) {
            const { currentDate, activeFilters, teamMembers } = calendarState;
            const visibleTherapists = activeFilters.length === 0 
                ? teamMembers 
                : teamMembers.filter(m => activeFilters.includes(m.id));
            
            if (visibleTherapists.length === 0) {
                viewElement.innerHTML = '<div style="padding: 2rem; text-align: center; color: #6b7280;">Selectează cel puțin un terapeut pentru a vizualiza calendarul.</div>';
                return;
            }
            
            const isTodayDate = isToday(currentDate);
            const isWeekendDay = isWeekend(currentDate);
            
            let html = '<div class="calendar-grid-day">';
            html += '<div class="time-column">';
            for (let hour = 8; hour <= 20; hour++) {
                html += `<div class="time-slot">${formatHour(hour)}</div>`;
            }
            html += '</div>';
            
            const dayClasses = [
                'day-column-single',
                isTodayDate && 'today',
                isWeekendDay && 'weekend'
            ].filter(Boolean).join(' ');
            
            html += `<div class="${dayClasses}">`;
            
            for (let hour = 8; hour <= 20; hour++) {
                const dateStr = formatDateISO(currentDate);
                html += `<div class="hour-slot-single" data-date="${dateStr}" data-hour="${hour}">
                            <div class="event-container" data-date="${dateStr}" data-hour="${hour}"></div>
                         </div>`;
            }
            
            html += '</div></div>';
            viewElement.innerHTML = html;
            
            renderEventsInPublicGrid([currentDate], viewElement);
        }

        function renderEventsInPublicGrid(days, viewElement) {
            const { activeFilters, teamMembers, clients } = calendarState;
            
            const visibleTherapists = activeFilters.length === 0 
                ? teamMembers 
                : teamMembers.filter(m => activeFilters.includes(m.id));
            
            if (visibleTherapists.length === 0) return;
            
            const trackWidth = 100 / visibleTherapists.length;
            
            days.forEach((day) => {
                const dateStr = formatDateISO(day);
                const dayEvents = getEventsForDatePublic(day);
                
                const eventsByTherapist = {};
                visibleTherapists.forEach(therapist => {
                    eventsByTherapist[therapist.id] = [];
                });
                
                dayEvents.forEach(event => {
                    const teamMemberIds = event.teamMemberIds || (event.teamMemberId ? [event.teamMemberId] : []);
                    teamMemberIds.forEach(memberId => {
                        if (eventsByTherapist[memberId]) {
                            eventsByTherapist[memberId].push(event);
                        }
                    });
                });
                
                visibleTherapists.forEach((therapist, therapistIndex) => {
                    const therapistEvents = eventsByTherapist[therapist.id] || [];
                    
                    therapistEvents.forEach((event) => {
                        if (!event.startTime || !event.duration) return;

                        const timeParts = event.startTime.split(':').map(Number);
                        const startHour = timeParts[0] || 0;
                        const startMinute = timeParts[1] || 0;
                        const formattedStartTime = `${String(startHour).padStart(2, '0')}:${String(startMinute).padStart(2, '0')}`;
                        
                        const containerSelector = `.event-container[data-date="${dateStr}"][data-hour="${startHour}"]`;
                        const container = viewElement.querySelector(containerSelector);
                        
                        if (!container) return;
                        
                        const eventBlock = document.createElement('div');
                        eventBlock.className = 'event-block';
                        
                        const endTime = calculateEndTime(event.startTime, event.duration);
                        
                        const topOffset = (startMinute / 60) * 120;
                        const height = (event.duration / 60) * 120;
                        eventBlock.style.top = `${topOffset}px`;
                        eventBlock.style.height = `${height}px`;
                        eventBlock.style.width = `${trackWidth}%`;
                        eventBlock.style.left = `${trackWidth * therapistIndex}%`;

                        if (event.isPublic) {
                            eventBlock.classList.add('admin-view');
                            eventBlock.style.backgroundColor = therapist.color;
                            
                            const clientIds = event.clientIds || (event.clientId ? [event.clientId] : []);
                            const clientNames = clientIds.map(id => {
                                const client = calendarState.clients.find(c => c.id === id);
                                return client ? client.name : '';
                            }).filter(Boolean).join(', ');

                            eventBlock.innerHTML = `
                                <div class="event-time">${formattedStartTime} - ${endTime}</div>
                                <div class="event-title">${event.name}</div>
                                ${clientNames ? `<div class="event-clients">${clientNames}</div>` : ''}
                            `;
                        } else {
                            eventBlock.classList.add('public-view-private');
                            eventBlock.style.borderColor = therapist.color;
                            eventBlock.style.borderStyle = "dashed";
                            eventBlock.style.borderWidth = "2px";
                            eventBlock.style.color = therapist.color;
                            
                            eventBlock.innerHTML = `
                                <div class="event-time">${formattedStartTime} - ${endTime}</div>
                                <div class="event-title">Ocupat</div>
                            `;
                        }
                        
                        container.appendChild(eventBlock);
                    });
                });
            });
        }

        function getEventsForDatePublic(dateObj) {
            const { events, activeFilters } = calendarState;
            const dateStr = formatDateISO(dateObj);
            
            return events.filter(event => {
                if (event.date !== dateStr) return false;
                if (activeFilters.length === 0) return true;
                
                const teamMemberIds = event.teamMemberIds || (event.teamMemberId ? [event.teamMemberId] : []);
                return teamMemberIds.some(id => activeFilters.includes(id));
            });
        }

        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay(); 
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function isToday(date) {
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        function isWeekend(date) {
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        function formatDateISO(date) {
            return date.toISOString().split('T')[0];
        }

        function formatHour(hour) {
            return `${String(hour).padStart(2, '0')}:00`;
        }

        function updateCurrentPeriodLabel(date, view) {
            const labelEl = document.getElementById('publicCurrentPeriod');
            if (!labelEl) return;
            
            let label = '';
            const ro = 'ro-RO';
            if (view === 'month') {
                label = date.toLocaleString(ro, { month: 'long', year: 'numeric' });
            } else if (view === 'week') {
                const start = getWeekStart(date);
                const end = new Date(start);
                end.setDate(end.getDate() + 6);
                label = `${start.toLocaleDateString(ro, {day: 'numeric', month: 'short'})} - ${end.toLocaleDateString(ro, {day: 'numeric', month: 'short', year: 'numeric'})}`;
            } else if (view === 'day') {
                label = date.toLocaleString(ro, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }
            labelEl.textContent = label;
        }

        // Calendar navigation handlers
        document.getElementById('publicPrevBtn').addEventListener('click', () => {
            const { currentView, currentDate } = calendarState;
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() - 1);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() - 7);
            } else if (currentView === 'day') {
                currentDate.setDate(currentDate.getDate() - 1);
            }
            renderPublicCalendar();
        });

        document.getElementById('publicTodayBtn').addEventListener('click', () => {
            calendarState.currentDate = new Date();
            renderPublicCalendar();
        });

        document.getElementById('publicNextBtn').addEventListener('click', () => {
            const { currentView, currentDate } = calendarState;
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + 1);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + 7);
            } else if (currentView === 'day') {
                currentDate.setDate(currentDate.getDate() + 1);
            }
            renderPublicCalendar();
        });

        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                calendarState.currentView = btn.dataset.view;
                renderPublicCalendar();
            });
        });

        // Initialize
        renderUserCards();
        initPublicCalendar();
    </script>
</body>
</html>
